name: Build Windows EXE

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained exe
        run: >
          dotnet publish -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true

      - name: Code sign (optional)
        env:
          CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $exe = "bin/Release/net8.0-windows/win-x64/publish/ProcessGuard.exe"
          if ([string]::IsNullOrWhiteSpace($env:CERT_PFX_BASE64)) {
            Write-Host "未配置 WINDOWS_CERT_PFX，跳过签名"
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "找不到 signtool.exe" }
          & $signtool sign /f $pfx /p $env:CERT_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 /v $exe
          if ($LASTEXITCODE -ne 0) { throw "签名失败，退出码: $LASTEXITCODE" }
          & $signtool verify /pa /v $exe
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "签名已写入，但证书链未被当前 Runner 信任；继续上传已签名 EXE。"
          }
          Remove-Item $pfx -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: ProcessGuard-windows
          path: bin/Release/net8.0-windows/win-x64/publish/ProcessGuard.exe

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/Release/net8.0-windows/win-x64/publish/ProcessGuard.exe
